site_name: Christian Designism
site_description: A research programme governed by biblical historical claims, held to Lakatosian criteria.
site_url: https://designism.thinxai.net/
repo_url: https://github.com/jdlongmire/christian-designism
repo_name: christian-designism
docs_dir: docs
theme:
  name: material
  font: false
  palette:
    scheme: default
  features:
  - navigation.footer
  - navigation.top
  - search.highlight
  - search.suggest
nav:
- Home: index.md
- The Programme: programme.md
- Registers: registers.md
- Lines and Repositories: lines.md
plugins:
- search
markdown_extensions:
- admonition
- attr_list
- md_in_html
